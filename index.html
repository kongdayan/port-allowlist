<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Port Allowlist</title><link rel="stylesheet" href="/web/style.css"><script type="module" src="/web/app.js"></script></head><body><div id="app"><p class="loading">正在读取通行状态…</p></div><div id="toast" role="status" aria-live="polite"></div><dialog id="secret"><h2>请保存这枚密钥</h2><p>密钥只显示这一次。设备密钥用于自动更新，客户密钥用于登录网页。</p><textarea id="secret-value" readonly aria-label="新密钥"></textarea><div class="actions"><button id="copy-secret">复制密钥</button><button id="close-secret" class="secondary">已妥善保存</button></div></dialog><dialog id="expiry-dialog"><h2>修改到期日</h2><p class="caption">所选日期的 00:00（UTC+8）起失效。</p><form id="renew-ip-form"><input type="hidden" name="id"><div class="expiry-fields"><label>有效天数<input type="number" name="days" min="1" required></label><label>到期日期<input type="date" name="expire_date" required></label></div><p class="caption deadline-preview"></p><div class="actions"><button type="submit">确认授权日期</button><button type="button" id="cancel-expiry" class="secondary">取消</button></div></form></dialog></body></html>
